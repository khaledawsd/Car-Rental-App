{% extends 'base.html' %}
{% block title %}Login - Car Rental System{% endblock %}
{% block content %}
    <div class="form-container">
        <h2>Login</h2>
        <form method="POST" action="">
            {{ form.hidden_tag() }}
            <div class="form-group">
                {{ form.username }}
            </div>
            <div class="form-group password-container">
                {{ form.password }}
                <span class="material-icons-outlined toggle-password" id="password-toggle" onclick="togglePassword('password')">visibility_off</span>
                <span class="caps-lock-indicator">Caps Lock On</span>
            </div>
            <div class="form-group">
                {{ form.submit(class="btn btn-primary") }}
            </div>
        </form>
    </div>
{% endblock %}
