{# Inline SVG icons. Bundled rather than loaded from a font CDN so the app has
   no external origins: it works offline, leaks no visitor IPs to a third
   party, and removes two render-blocking round trips. #}

{%- macro icon(name, cls="icon") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "car" -%}
  <path d="M5 17h14M6.5 17a1.5 1.5 0 1 1 3 0M14.5 17a1.5 1.5 0 1 1 3 0"/>
  <path d="M3 13.5h18M4 13.5l1.8-5A2 2 0 0 1 7.7 7h8.6a2 2 0 0 1 1.9 1.5l1.8 5v3.5H4z"/>
{%- elif name == "dashboard" -%}
  <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
{%- elif name == "users" -%}
  <path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/>
  <circle cx="10" cy="8" r="3.2"/><path d="M17 11.2a3 3 0 0 0 0-6M20 20v-1.5a3.5 3.5 0 0 0-2.5-3.35"/>
{%- elif name == "calendar" -%}
  <rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>
{%- elif name == "logout" -%}
  <path d="M14 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h8M17 15l4-3-4-3M21 12H10"/>
{%- elif name == "login" -%}
  <path d="M10 4h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-8M7 15l-4-3 4-3M3 12h11"/>
{%- elif name == "user-plus" -%}
  <path d="M15 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-4A3.5 3.5 0 0 0 4 18.5V20"/>
  <circle cx="9.5" cy="8" r="3.2"/><path d="M18 8v6M21 11h-6"/>
{%- elif name == "user" -%}
  <circle cx="12" cy="8" r="3.4"/><path d="M5 20v-1a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v1"/>
{%- elif name == "lock" -%}
  <rect x="4.5" y="10" width="15" height="10" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/>
{%- elif name == "eye" -%}
  <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == "eye-off" -%}
  <path d="M10 5.7A7.9 7.9 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3.3 4M6.2 7.4A17 17 0 0 0 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.2-1"/>
  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/>
{%- elif name == "plus" -%}
  <path d="M12 5v14M5 12h14"/>
{%- elif name == "edit" -%}
  <path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3zM14.5 7.5l2 2"/>
{%- elif name == "trash" -%}
  <path d="M4 7h16M9.5 7V5.5A1.5 1.5 0 0 1 11 4h2a1.5 1.5 0 0 1 1.5 1.5V7M6.5 7l.8 12a2 2 0 0 0 2 1.9h5.4a2 2 0 0 0 2-1.9l.8-12"/>
{%- elif name == "moon" -%}
  <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2z"/>
{%- elif name == "sun" -%}
  <circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/>
{%- elif name == "check" -%}
  <path d="M20 6.5 9.5 17 4 11.5"/>
{%- elif name == "check-circle" -%}
  <circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.5 2.5 4.5-4.9"/>
{%- elif name == "alert" -%}
  <circle cx="12" cy="12" r="8.5"/><path d="M12 7.8v4.7M12 16.1h.01"/>
{%- elif name == "info" -%}
  <circle cx="12" cy="12" r="8.5"/><path d="M12 16.2v-4.7M12 8h.01"/>
{%- elif name == "clock" -%}
  <circle cx="12" cy="12" r="8.5"/><path d="M12 7.4V12l3 1.8"/>
{%- elif name == "wallet" -%}
  <path d="M3.5 8.5A2.5 2.5 0 0 1 6 6h11.5a2 2 0 0 1 2 2v.5M3.5 8.5V17a2.5 2.5 0 0 0 2.5 2.5h12a2 2 0 0 0 2-2v-2.2M3.5 8.5h14"/>
  <path d="M20.5 12.3v3h-3.2a1.5 1.5 0 0 1 0-3h3.2z"/>
{%- elif name == "menu" -%}
  <path d="M4 7h16M4 12h16M4 17h16"/>
{%- elif name == "inbox" -%}
  <path d="M3.5 13h4l1.2 2.2h6.6L16.5 13h4"/>
  <path d="M5.6 5.4h12.8a2 2 0 0 1 1.9 1.4l1.2 6.2V17a2.5 2.5 0 0 1-2.5 2.5h-14A2.5 2.5 0 0 1 2.5 17v-4l1.2-6.2a2 2 0 0 1 1.9-1.4z"/>
{%- elif name == "shield" -%}
  <path d="M12 3.5l7 2.6V12c0 4.3-2.9 7.3-7 8.5-4.1-1.2-7-4.2-7-8.5V6.1l7-2.6z"/><path d="M9 12.2l2.2 2.2 3.8-4"/>
{%- endif -%}
</svg>
{%- endmacro -%}
