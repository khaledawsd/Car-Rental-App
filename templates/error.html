{% extends 'base.html' %}
{% block title %}{{ title }} - Car Rental System{% endblock %}
{% block content %}
<div class="form-container">
    <p class="error-code">{{ code }}</p>
    <h2>{{ title }}</h2>
    <p>{{ message }}</p>
    <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}"
       class="btn btn-primary">
        {{ 'Back to dashboard' if current_user.is_authenticated else 'Back to login' }}
    </a>
</div>
{% endblock %}
